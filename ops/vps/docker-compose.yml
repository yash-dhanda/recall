name: recall

services:
  backend:
    build:
      context: ../..
      dockerfile: ops/vps/Dockerfile.backend
    container_name: recall-backend
    restart: unless-stopped
    environment:
      RECALL_DB: /data/recall.db
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      RECALL_MODEL: ${RECALL_MODEL:-deepseek-chat}
      RECALL_MAX_COST_USD: ${RECALL_MAX_COST_USD:-2.0}
      RECALL_UPLOAD_DIR: /uploads
      # Social sign-in stays off until these are set in .env.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      RECALL_PUBLIC_URL: ${RECALL_PUBLIC_URL:-}
    volumes:
      - /srv/recall/data:/data
      - /srv/recall/uploads:/uploads
      # Course material a lesson can be checked against. Read-only: the loader
      # reads text out of these files and stores it, and nothing at runtime
      # touches them again — retrieval reads the database. Safe to delete the
      # directory once a unit is loaded.
      - /srv/recall/corpus:/corpus:ro
    networks: [bots]

  frontend:
    build:
      context: ../..
      dockerfile: ops/vps/Dockerfile.frontend
    container_name: recall-frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [bots]

networks:
  bots:
    external: true
    name: mcbots_bots
